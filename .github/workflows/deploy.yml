name: Deploy to Cloud Run
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REPO: ${{ vars.ARTIFACT_REPO }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5

      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --dev
          uv run pytest tests/ -v

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Validate Docker builds
        run: |
          docker build -t backend-ci ./backend
          docker build --build-arg VITE_API_URL=http://localhost:8080 -t frontend-ci ./frontend

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/backend:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy backend \
            --project ${{ env.PROJECT }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --quiet

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe backend \
            --project ${{ env.PROJECT }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend
        run: |
          curl -sf "${{ steps.backend-url.outputs.url }}/health" | grep -q '"status":"ok"'

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/frontend:${{ github.sha }}
          docker build \
            --build-arg VITE_API_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            -t $IMAGE ./frontend
          docker push $IMAGE

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy frontend \
            --project ${{ env.PROJECT }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --quiet

      - name: Get frontend URL
        id: frontend-url
        run: |
          URL=$(gcloud run services describe frontend \
            --project ${{ env.PROJECT }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test frontend
        run: |
          curl -sf "${{ steps.frontend-url.outputs.url }}" | grep -qi "serverless-fastapi"
