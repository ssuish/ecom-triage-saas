[project]
name = "triage-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18.4,<2.0.0",
    "clerk-backend-api>=5.0.6,<6.0.0",
    "fastapi>=0.136.1,<1.0.0",
    "google-genai>=2.4.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "qstash>=3.4.0,<4.0.0",
    "resend>=2.30.1,<3.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49,<3.0.0",
    "svix>=1.94.0,<2.0.0",
    "uvicorn[standard]>=0.47.0,<1.0.0",
]

[dependency-groups]
dev = [
    "locust>=2.44.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
